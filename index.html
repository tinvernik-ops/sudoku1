  if (sel >= 0) for (let i = 0; i < n * n; i++) if (Math.floor(i / n) === Math.floor(sel / n) || i % n === sel % n || (p.reg && p.reg[i] === p.reg[sel])) box(i).setAttribute('class', 'peer');
  if (d) for (let i = 0; i < n * n; i++) if ((p.giv[i] || it.ans[i]) === d) box(i).setAttribute('class', 'same');

}
